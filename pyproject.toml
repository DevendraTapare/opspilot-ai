[project]
name = "opspilot-ai"
version = "0.1.0"
description = "Incident simulator, least-privilege MCP gateway, and LangGraph investigator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120,<1",
  "pydantic>=2.14.3,<3",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2.0.44,<2.1",
  "alembic>=1.17,<2",
  "psycopg[binary]>=3.2.12,<4",
  "uvicorn>=0.38,<1",
  "mcp>=2.2,<3",
  "langgraph>=1.2.19,<2",
  "httpx2>=2.13,<3",
  "langgraph-checkpoint-postgres>=3.1.2,<5",
  "opentelemetry-sdk==1.45.1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx2>=2.13,<3", "ruff>=0.14,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".venv", "artifacts"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["postgres: requires a dedicated PostgreSQL test database", "live: requires a running API", "real_model: opt-in real LLM smoke; never fixture inference"]

[tool.uv]
package = false
